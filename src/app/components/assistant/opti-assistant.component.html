<!-- Floating Trigger Button -->
<div class="fixed bottom-6 right-6 z-50">
  
  <button (click)="toggleChat()" 
          class="flex items-center gap-3 bg-slate-900 text-amber-300 hover:bg-slate-800 px-5 py-3.5 rounded-full shadow-2xl transition hover:scale-105 border border-amber-500/30">
    <div class="w-8 h-8 rounded-full bg-amber-500/20 text-amber-300 flex items-center justify-center text-lg animate-pulse">
      <i class="fa-solid fa-wand-magic-sparkles"></i>
    </div>
    <div class="text-left font-semibold text-xs leading-tight">
      <span class="block font-bold text-white text-sm">OptiAssistant</span>
      <span class="text-[10px] text-amber-400">Conseiller Visuel IA</span>
    </div>
  </button>

</div>

<!-- Chat Window Modal -->
<div *ngIf="isOpen" class="fixed bottom-24 right-6 w-96 max-w-[calc(100vw-2rem)] bg-white rounded-3xl shadow-2xl border border-slate-200 z-50 overflow-hidden flex flex-col h-[520px] animate-fade-in">
  
  <!-- Header -->
  <div class="bg-slate-900 text-white p-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-amber-600 text-white flex items-center justify-center font-bold text-base shadow-sm">
        <i class="fa-solid fa-glasses"></i>
      </div>
      <div>
        <h4 class="font-bold text-sm text-white flex items-center gap-1.5">
          OptiAssistant <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        </h4>
        <span class="text-[10px] text-slate-300 block">Intelligence Artificielle OptiVision</span>
      </div>
    </div>
    
    <button (click)="toggleChat()" class="text-slate-400 hover:text-white p-1">
      <i class="fa-solid fa-xmark text-lg"></i>
    </button>
  </div>

  <!-- Medical Notice Banner -->
  <div class="bg-amber-50 text-amber-900 text-[10px] p-2.5 px-4 font-medium border-b border-amber-200 flex items-center gap-2">
    <i class="fa-solid fa-triangle-exclamation text-amber-600 text-xs shrink-0"></i>
    <span>Les recommandations IA sont fournies à titre indicatif. Les prescriptions nécessitent la validation de nos opticiens diplômés.</span>
  </div>

  <!-- Messages Scroll Area -->
  <div class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50">
    <div *ngFor="let msg of messages" [class.justify-end]="msg.sender === 'USER'" class="flex gap-2.5">
      
      <div *ngIf="msg.sender === 'BOT'" class="w-7 h-7 rounded-full bg-slate-900 text-amber-300 flex items-center justify-center text-xs shrink-0">
        <i class="fa-solid fa-robot"></i>
      </div>

      <div [class.bg-slate-900]="msg.sender === 'USER'"
           [class.text-white]="msg.sender === 'USER'"
           [class.bg-white]="msg.sender === 'BOT'"
           [class.text-slate-800]="msg.sender === 'BOT'"
           [class.border]="msg.sender === 'BOT'"
           [class.border-slate-200]="msg.sender === 'BOT'"
           class="p-3 rounded-2xl max-w-[85%] text-xs shadow-sm space-y-2">
        <p>{{ msg.text }}</p>
        
        <div *ngIf="msg.actionLink" class="pt-1">
          <a [routerLink]="msg.actionLink.url" (click)="toggleChat()" class="inline-flex items-center gap-1 bg-amber-600 text-white px-3 py-1.5 rounded-lg text-[11px] font-bold hover:bg-amber-700 transition">
            {{ msg.actionLink.label }} <i class="fa-solid fa-arrow-right text-[9px]"></i>
          </a>
        </div>
        <span class="block text-[9px] text-slate-400 text-right font-mono">{{ msg.timestamp }}</span>
      </div>

    </div>
  </div>

  <!-- Quick Prompts Pill List -->
  <div class="p-2 px-3 bg-white border-t border-slate-100 flex items-center gap-1.5 overflow-x-auto text-[11px]">
    <button *ngFor="let prompt of quickPrompts" (click)="sendQuick(prompt)" class="whitespace-nowrap bg-slate-100 hover:bg-amber-100 hover:text-amber-900 text-slate-700 font-semibold px-2.5 py-1 rounded-full border border-slate-200 transition">
      {{ prompt }}
    </button>
  </div>

  <!-- Input Footer -->
  <div class="p-3 bg-white border-t border-slate-200 flex items-center gap-2">
    <input type="text" [(ngModel)]="userInput" (keyup.enter)="send()" placeholder="Posez une question à OptiAssistant..." class="flex-1 bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-amber-600">
    <button (click)="send()" class="w-8 h-8 rounded-xl bg-slate-900 text-white flex items-center justify-center hover:bg-amber-700 transition">
      <i class="fa-solid fa-paper-plane text-xs"></i>
    </button>
  </div>

</div>
